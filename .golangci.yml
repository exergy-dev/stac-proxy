# golangci-lint configuration for stac-proxy (v2 format).
# See https://golangci-lint.run/usage/configuration for the full schema.
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    # TODO(v0.3): re-enable gocritic, noisy under lint v2 (193 httpNoBody +
    # hugeParam/octalLiteral/etc. cosmetic findings; mostly in tests).
    # - gocritic
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G101
        - G104
        - G404
    staticcheck:
      # SA* (real-bug) checks stay on; disable the style/quickfix nags
      # newly bundled under lint v2. TODO(v0.3): revisit.
      checks:
        - all
        - -ST1023
        - -QF1001
        - -QF1008
        - -QF1011
    revive:
      rules:
        - name: exported
          disabled: false
          # Pre-existing exported-type stutters (FederationStats, AuthzInput,
          # …); renaming exported types is a breaking change, out of scope.
          arguments:
            - disableStutteringCheck
        - name: var-naming
        - name: error-strings
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files: relax exported-comment, gosec, and unchecked errors /
      # unused test helpers.
      - linters:
          - gosec
          - revive
          - errcheck
          - unused
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
