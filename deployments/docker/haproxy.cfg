# HAProxy edge for a multi-replica stac-proxy deployment.
#
# Why HAProxy and not nginx: with the default `store: memory` the proxy
# keeps ALL hot state in-memory per replica (response cache, rate-limit
# token buckets, federation page cache). We therefore need (a) sticky
# routing so a client consistently lands on one replica and (b) ACTIVE
# health checks so a dead replica is pulled from the hash ring. OSS nginx
# has no active health checks; HAProxy does.
#
# With the shared-Redis topology (`store: redis`, see docs/deploy.md)
# stickiness is unnecessary — switch `balance source` to
# `balance roundrobin` if you like; keeping source-hash is harmless.

global
    log stdout format raw local0 info
    # No privileged features needed; run as the image's default user.
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # forwardfor would ADD an X-Forwarded-For entry; we set the header
    # explicitly in the frontend instead (see the trust-boundary note there),
    # so it is intentionally NOT enabled here.
    timeout connect 5s
    # client/server timeouts must be >= the proxy's WriteTimeout (default 60s)
    # or a long-running federated fan-out/search gets cut off mid-response.
    # 65s leaves a small margin above the 60s app write timeout.
    timeout client  65s
    timeout server  65s
    # Bound idle keep-alive connections so scaled-down replicas drain.
    timeout http-keep-alive 10s

# Docker's embedded DNS. server-template entries below use this to (re)resolve
# the compose service name to current replica IPs as you scale up/down.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries    3
    timeout resolve    1s
    timeout retry      1s
    # Re-resolve on this cadence and honour short Docker DNS TTLs.
    hold valid    5s
    hold nx       1s
    hold timeout  1s
    hold refused  1s
    hold obsolete 1s

frontend fe_stac
    bind :8080

    # ---- Trust boundary --------------------------------------------------
    # The proxy's chi RealIP middleware trusts X-Forwarded-For UNCONDITIONALLY.
    # This edge is the trust boundary, so it must own that header: drop any
    # client-supplied value first, then set it from the real TCP source. This
    # is what makes rate-limit keys, logs, and audit fields trustworthy.
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]
    # TLS is terminated upstream of this edge (or absent in dev); tell the
    # app the scheme it should assume.
    http-request set-header X-Forwarded-Proto http

    default_backend be_stac

backend be_stac
    # ---- Stickiness ------------------------------------------------------
    # balance source hashes the client source IP to a replica. hash-type
    # consistent means adding/removing a replica remaps only ~1/N of clients
    # instead of reshuffling everyone -- important because a remap mid-
    # pagination drops that client's in-memory page cache (rel: prev/first
    # then degrade to a re-fan-out).
    balance source
    hash-type consistent

    # ---- Active health checks -------------------------------------------
    # GET /health; a replica is marked DOWN (and removed from the hash ring)
    # after `fall 2` consecutive failures, and back UP after `rise 2`.
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200

    # ---- Replica slots ---------------------------------------------------
    # server-template pre-creates N slots that resolve the compose service
    # name "stac-proxy" via Docker DNS. init-addr none lets HAProxy start
    # even before any replica is up (slots go live as DNS resolves them).
    #
    # SCALE CEILING: the template count (6) caps how many replicas this edge
    # will route to. Scaling `--scale stac-proxy=N` beyond 6 leaves the extra
    # replicas unused. Raise this number (and re-deploy the edge) to lift it.
    server-template stac 6 stac-proxy:8080 check inter 5s fall 2 rise 2 resolvers docker init-addr none
