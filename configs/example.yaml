# stac-proxy example configuration
# Single-origin mode - proxies to a single upstream STAC server

server:
  host: "0.0.0.0"
  port: 8080
  timeouts:
    read: 30s
    read_header: 10s
    write: 60s
    idle: 120s
  # public_base_url is the externally reachable URL clients use to reach
  # this proxy. When set, response links and pagination `next` URLs are
  # rewritten as absolute hrefs rooted here, and `rewrite_assets: proxy`
  # is supported. Leave empty to emit relative links (only suitable when
  # client and proxy share a host).
  # public_base_url: "https://stac.example.com"

logging:
  level: "info"
  format: "json"

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

health:
  path: "/health"

# Operating mode: "single" or "federation"
mode: single

# Single origin configuration
upstream:
  url: "https://earth-search.aws.element84.com/v1"
  timeout: 30s
  # When true, the proxy pushes authz CQL2 filters (including geofence
  # S_INTERSECTS predicates) into the search request rather than
  # post-filtering responses. Requires the upstream to support the STAC
  # Filter Extension (cql2-text / cql2-json).
  # supports_filter_extension: true

# Authorization configuration (uncomment to enable)
# authz:
#   policy_source: opa
#   default_effect: deny
#   opa:
#     embedded: true
#     rego_files:
#       - policies/stac_authz.rego
#   # CQL2 filter injection. When enabled, policies may emit a
#   # `cql2_filter` (or `cql2_filter_json`) constraint that the proxy
#   # AND-combines with any client-supplied filter and forwards
#   # upstream. The post-response geofence filter is automatically
#   # skipped for requests whose geofence was successfully pushed down.
#   cql2_injection:
#     enabled: true
#     combine: and    # reserved for future strategies; only "and" today

# Middleware configuration (order matters for priority)
middleware:
  - name: logging
    config:
      include_body: false

  - name: cache
    config:
      store: memory
      max_size: 10000
      collection_ttl: 5m
      item_ttl: 1m
      search_ttl: 30s

  # CORS — preflight short-circuits and per-response headers for browser
  # callers. `allowed_origins: ["*"]` is mutually exclusive with
  # `allow_credentials: true` (Fetch spec). To support credentialed
  # cross-origin requests, list exact origins instead.
  - name: cors
    config:
      allowed_origins:
        - "*"
      allowed_methods: [GET, HEAD, POST, OPTIONS]
      allowed_headers: [Authorization, Content-Type, Accept, Range]
      exposed_headers: [ETag, Content-Range]
      allow_credentials: false
      max_age: 600
