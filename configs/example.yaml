# stac-proxy example configuration
# Single-origin mode - proxies to a single upstream STAC server

server:
  host: "0.0.0.0"
  port: 8080
  timeouts:
    read: 30s
    write: 60s
    idle: 120s

logging:
  level: "info"
  format: "json"
  output: "stdout"

metrics:
  enabled: true
  path: "/metrics"
  port: 9090

health:
  path: "/health"
  check_upstreams: true
  check_interval: 30s

# Operating mode: "single" or "federation"
mode: single

# Single origin configuration
upstream:
  url: "https://earth-search.aws.element84.com/v1"
  timeout: 30s
  # When true, the proxy pushes authz CQL2 filters (including geofence
  # S_INTERSECTS predicates) into the search request rather than
  # post-filtering responses. Requires the upstream to support the STAC
  # Filter Extension (cql2-text / cql2-json).
  # supports_filter_extension: true

# Authorization configuration (uncomment to enable)
# authz:
#   policy_source: opa
#   default_effect: deny
#   opa:
#     embedded: true
#     rego_files:
#       - policies/stac_authz.rego
#   # CQL2 filter injection. When enabled, policies may emit a
#   # `cql2_filter` (or `cql2_filter_json`) constraint that the proxy
#   # AND-combines with any client-supplied filter and forwards
#   # upstream. The post-response geofence filter is automatically
#   # skipped for requests whose geofence was successfully pushed down.
#   cql2_injection:
#     enabled: true
#     combine: and    # reserved for future strategies; only "and" today

# Middleware configuration (order matters for priority)
middleware:
  - name: logging
    config:
      include_body: false

  - name: cache
    config:
      store: memory
      max_size: 10000
      collection_ttl: 5m
      item_ttl: 1m
      search_ttl: 30s
